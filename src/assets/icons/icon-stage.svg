  <defs>

    <mask id="grid-mask">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <g fill="#404040">
      <rect x="258.8" y="226.0" width="231.2" height="44.0" rx="22" ry="22"/>
      <rect x="534.0" y="226.0" width="231.2" height="44.0" rx="22" ry="22"/>
      <rect x="258.0" y="292.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="534.0" y="292.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="258.0" y="358.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="534.0" y="358.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="258.0" y="424.0" width="196.0" height="44.0" rx="22" ry="22"/>
      <rect x="570.0" y="424.0" width="196.0" height="44.0" rx="22" ry="22"/>
      <rect x="258.0" y="490.0" width="196.0" height="44.0" rx="22" ry="22"/>
      <rect x="570.0" y="490.0" width="196.0" height="44.0" rx="22" ry="22"/>
      <rect x="258.0" y="556.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="534.0" y="556.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="258.0" y="622.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="534.0" y="622.0" width="232.0" height="44.0" rx="22" ry="22"/>
      <rect x="318.0" y="113.1" width="44.0" height="86.9" rx="22" ry="22"/>
      <rect x="318.0" y="700.0" width="44.0" height="88.9" rx="22" ry="22"/>
      <rect x="386.8" y="85.7" width="44.0" height="114.3" rx="22" ry="22"/>
      <rect x="386.8" y="700.0" width="44.0" height="116.3" rx="22" ry="22"/>
      <rect x="455.6" y="84.0" width="44.0" height="116.0" rx="22" ry="22"/>
      <rect x="455.6" y="700.0" width="44.0" height="118.0" rx="22" ry="22"/>
      <rect x="524.4" y="84.0" width="44.0" height="116.0" rx="22" ry="22"/>
      <rect x="524.4" y="700.0" width="44.0" height="118.0" rx="22" ry="22"/>
      <rect x="593.2" y="85.7" width="44.0" height="114.3" rx="22" ry="22"/>
      <rect x="593.2" y="700.0" width="44.0" height="116.3" rx="22" ry="22"/>
      <rect x="662.0" y="113.1" width="44.0" height="86.9" rx="22" ry="22"/>
      <rect x="662.0" y="700.0" width="44.0" height="88.9" rx="22" ry="22"/>
      </g>
    </mask>

    <!-- Mic Body -->
    <path id="body" d="M592 808H432a160 160 0 0 1-160-160V264A160 160 0 0 1 432 104h160a160 160 0 0 1 160 160v384a160 160 0 0 1-160 160z"/>
    <!-- Support Gradient -->
    <linearGradient id="support-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#404040"/>
      <stop offset="100%" style="stop-color:#171717"/>
    </linearGradient>
    <!-- Metallic Head Gradient (light from top-left) -->
    <linearGradient id="metal-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color:#D4D4D4"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
  </defs>

  <!-- Background with Radial Gradient -->
  <circle cx="512" cy="512" r="504" fill="#FFFFFF" stroke="#606060" stroke-width="16"/>

  <!-- Audio Waves (Enlarged but Nearer and Vertically Compact) -->
  <g id="waves" fill="none" stroke-linecap="round">
    <!-- Left Waves - Closer to Mic Body (Starting from x=235) -->
    <path d="M235 340 A 180 180 0 0 0 235 570"/>
    <path d="M195 300 A 240 240 0 0 0 195 610"/>
    <path d="M155 260 A 300 300 0 0 0 155 650"/>

    <!-- Right Waves - Closer to Mic Body (Starting from x=789) -->
    <path d="M789 340 A 180 180 0 0 1 789 570"/>
    <path d="M829 300 A 240 240 0 0 1 829 610"/>
    <path d="M869 260 A 300 300 0 0 1 869 650"/>
  </g>

  <!-- Waves: dark yellow border (wider stroke underneath) + yellow fill stroke -->
  <use xlink:href="#waves" stroke="#D97706" stroke-width="36"/>
  <use xlink:href="#waves" stroke="#FBBF24" stroke-width="24"/>

  <!-- Trapezoid Support -->
  <path fill="url(#support-gradient)" d="M387 800H637L612 896Q612 906 582 926H442Q412 906 412 896Z"/>

  <!-- Microphone Head -->
  <use xlink:href="#body" fill="#121212"/>
  <use xlink:href="#body" fill="url(#metal-gradient)" mask="url(#grid-mask)"/>

  <!-- Seal "G" -->
  <g transform="translate(512 476)">
    <circle r="46" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="6"/>
    <text y="18" text-anchor="middle" font-family="Molle" font-style="italic" font-weight="700" font-size="52" fill="#172554">G</text>
  </g>
</svg>
