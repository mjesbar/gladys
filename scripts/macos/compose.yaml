services:
  macos:
    image: dockurr/macos
    container_name: macos
    privileged: true
    stop_grace_period: 5s
    environment:
      VERSION: "14"
      # CPU_MODEL: "Haswell-noTSX"
      # CPU_MODEL: "Skylake-Client-v4"
      CPU_CORES: "4"
      RAM_SIZE: "8G"
      ARGUMENTS: "-device usb-host,vendorid=0x08bb,productid=0x29c3"
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/bus/usb
    ports:
      - "5900:5900"
      - "8006:8006"
      - "2222:22"
    volumes:
      - ${HOME}/macos:/storage
      - ${HOME}/Github/mjesbar/gladys:/shared/gladys
