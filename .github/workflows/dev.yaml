name: Dev Build

on:
  pull_request:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  # ----------------------------------------------------------------
  # Linux
  # ----------------------------------------------------------------
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 dev
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          cache: true

      - name: Build
        run: scripts/build.sh

      - name: Show dist/ structure
        run: tree -ash dist/

      - name: Smoke test built app
        shell: bash
        env:
          QT_LOGGING_TO_CONSOLE: "1"
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          cd dist
          ./gladys > smoke.log 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" 2>/dev/null || { cat smoke.log; echo "gladys exited early"; exit 1; }
          kill "$pid"
          cat smoke.log
          grep -q "gladys.main\] started" smoke.log || { echo "no start log"; exit 1; }
          ! grep -q FATAL smoke.log

  # ----------------------------------------------------------------
  # Windows
  # ----------------------------------------------------------------
  build-win-x64:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Build
        run: scripts/build.sh
        shell: bash

      - name: Show dist/ structure
        run: tree /f /a dist\

      - name: Smoke test built app
        shell: bash
        env:
          QT_LOGGING_TO_CONSOLE: "1"
        run: |
          cd dist
          ./gladys.exe > smoke.log 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" 2>/dev/null || { cat smoke.log; echo "gladys exited early"; exit 1; }
          kill "$pid"
          cat smoke.log
          grep -q "gladys.main\] started" smoke.log || { echo "no start log"; exit 1; }
          ! grep -q FATAL smoke.log

  # ----------------------------------------------------------------
  # macOS
  # ----------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          cache: true

      - name: Build
        run: scripts/build.sh

      - name: Install tree
        run: brew install tree

      - name: Show dist/ structure
        run: tree -ash dist/

      - name: Smoke test built app
        shell: bash
        env:
          QT_LOGGING_TO_CONSOLE: "1"
        run: |
          cd dist
          ./gladys > smoke.log 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" 2>/dev/null || { cat smoke.log; echo "gladys exited early"; exit 1; }
          kill "$pid"
          cat smoke.log
          grep -q "gladys.main\] started" smoke.log || { echo "no start log"; exit 1; }
          ! grep -q FATAL smoke.log
