name: Dev Build

on:
  pull_request:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"

env:
  BUILD_TYPE: Release

jobs:
  # ----------------------------------------------------------------
  # Linux
  # ----------------------------------------------------------------
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 dev
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install Qt6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-svg-dev

      - name: Build
        run: make build

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 dev
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install Qt6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-svg-dev

      - name: Build
        run: make build

  # ----------------------------------------------------------------
  # Windows
  # ----------------------------------------------------------------
  build-win-x64:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Build
        run: make build

  # ----------------------------------------------------------------
  # macOS
  # ----------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          cache: true

      - name: Build
        run: make build
