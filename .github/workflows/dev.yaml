name: Dev Build

on:
  pull_request:
    branches:
      - "[0-9]*.[0-9]*.[0-9]*"

env:
  BUILD_TYPE: Release
  GLADYS_SPACE: ${{ github.workspace }}

jobs:
  # ----------------------------------------------------------------
  # Linux
  # ----------------------------------------------------------------
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 dev, FUSE and tree
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libfuse2t64 tree

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          dir: ${{ github.workspace }}/Qt
          install-deps: true
          cache: true

      - name: Build
        run: scripts/build.sh --os linux --arch x64 --ma-debug off

      - name: Show dist/ structure
        run: tree -a dist/

  # ----------------------------------------------------------------
  # Windows
  # ----------------------------------------------------------------
  build-win-x64:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Build
        run: scripts/build.sh --os windows --arch x64 --ma-debug off
        shell: bash

      - name: Show dist/ structure
        run: tree /f /a dist\

  # ----------------------------------------------------------------
  # macOS
  # ----------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Build
        run: scripts/build.sh --os macos --arch arm64 --ma-debug off

      - name: Install tree
        run: brew install tree

      - name: Show dist/ structure
        run: tree -a dist/
