name: Prod Release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from merged branch name
        id: extract
        run: |
          echo "version=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Linux
  # ----------------------------------------------------------------
  release-linux-x64:
    name: Release Linux x64
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 dev
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          dir: ${{ github.workspace }}/Qt
          install-deps: true
          cache: true

      - name: Build
        run: scripts/build.sh

      - name: Show dist/ structure
        run: tree -a dist/

      - name: Package release
        run: scripts/package.sh linux x64 ${{ needs.version.outputs.version }}

      - name: Show release/ structure
        run: tree -a -L 3 release/gladys-v*

      - name: Smoke test packaged app
        shell: bash
        env:
          QT_LOGGING_TO_CONSOLE: "1"
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          export DISPLAY=:99
          cd release/gladys-v${{ needs.version.outputs.version }}
          ./gladys > smoke.log 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" 2>/dev/null || { cat smoke.log; echo "gladys exited early"; exit 1; }
          kill "$pid"
          cat smoke.log
          grep -q "gladys.main\] started" smoke.log || { echo "no start log"; exit 1; }
          ! grep -q FATAL smoke.log

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Gladys v${{ needs.version.outputs.version }}
          files: release/gladys-linux-x64-*.tar.gz

  # ----------------------------------------------------------------
  # Windows
  # ----------------------------------------------------------------
  release-win-x64:
    name: Release Windows x64
    needs: [version]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Build
        run: scripts/build.sh
        shell: bash

      - name: Show dist/ structure
        run: tree /f dist\

      - name: Install rsync & zip
        run: choco install rsync zip --no-progress -y

      - name: Package release
        run: scripts/package.sh windows x64 ${{ needs.version.outputs.version }}
        shell: bash

      - name: Show release/ structure
        run: tree /f /a release\gladys-v*

      - name: Smoke test packaged app
        shell: bash
        env:
          QT_LOGGING_TO_CONSOLE: "1"
        run: |
          cd release/gladys-v${{ needs.version.outputs.version }}
          ./gladys.exe > smoke.log 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" 2>/dev/null || { cat smoke.log; echo "gladys exited early"; exit 1; }
          kill "$pid"
          cat smoke.log
          grep -q "gladys.main\] started" smoke.log || { echo "no start log"; exit 1; }
          ! grep -q FATAL smoke.log

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Gladys v${{ needs.version.outputs.version }}
          files: release/gladys-win-x64-*.zip

  # ----------------------------------------------------------------
  # macOS
  # ----------------------------------------------------------------
  release-macos-arm64:
    name: Release macOS ARM64
    needs: [version]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Build
        run: scripts/build.sh

      - name: Install tree
        run: brew install tree

      - name: Show dist/ structure
        run: tree -a dist/

      - name: Package release
        run: scripts/package.sh macos arm64 ${{ needs.version.outputs.version }}

      - name: Show release/ structure
        run: tree -a -L 3 release/gladys-v*

      - name: Smoke test packaged app
        shell: bash
        env:
          QT_LOGGING_TO_CONSOLE: "1"
        run: |
          cd release/gladys-v${{ needs.version.outputs.version }}
          ./gladys > smoke.log 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" 2>/dev/null || { cat smoke.log; echo "gladys exited early"; exit 1; }
          kill "$pid"
          cat smoke.log
          grep -q "gladys.main\] started" smoke.log || { echo "no start log"; exit 1; }
          ! grep -q FATAL smoke.log

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Gladys v${{ needs.version.outputs.version }}
          files: release/gladys-macos-arm64-*.zip
