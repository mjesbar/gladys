name: Prod Release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from merged branch name
        id: extract
        run: |
          echo "version=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Linux
  # ----------------------------------------------------------------
  release-linux-x64:
    name: Release Linux x64
    needs: [version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 dev
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "linux"
          target: "desktop"
          arch: "linux_gcc_64"
          dir: ${{ github.workspace }}/Qt
          install-deps: true
          cache: true

      - name: Build
        run: make build

      - name: Show dist/ structure
        run: tree -a dist/

      - name: Package release
        run: make package-linux ARCH=x64 VERSION=${{ needs.version.outputs.version }}

      - name: Show release/ structure
        run: tree -a -L 3 release/gladys-v*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Gladys v${{ needs.version.outputs.version }}
          files: release/gladys-linux-x64-*.tar.gz

  # ----------------------------------------------------------------
  # Windows
  # ----------------------------------------------------------------
  release-win-x64:
    name: Release Windows x64
    needs: [version]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Build
        run: make build

      - name: Show dist/ structure
        run: tree /f dist\

      - name: Install rsync & zip
        run: choco install rsync zip --no-progress -y

      - name: Package release
        run: make package-win ARCH=x64 VERSION=${{ needs.version.outputs.version }}

      - name: Show release/ structure
        run: tree /f /a release\gladys-v*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Gladys v${{ needs.version.outputs.version }}
          files: release/gladys-win-x64-*.zip

  # ----------------------------------------------------------------
  # macOS
  # ----------------------------------------------------------------
  release-macos-arm64:
    name: Release macOS ARM64
    needs: [version]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: "==3.3.*"
          version: "6.8.3"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          dir: ${{ github.workspace }}/Qt
          cache: true

      - name: Build
        run: make build

      - name: Install tree
        run: brew install tree

      - name: Show dist/ structure
        run: tree -a dist/

      - name: Package release
        run: make package-macos ARCH=arm64 VERSION=${{ needs.version.outputs.version }}

      - name: Show release/ structure
        run: tree -a -L 3 release/gladys-v*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Gladys v${{ needs.version.outputs.version }}
          files: release/gladys-macos-arm64-*.zip
