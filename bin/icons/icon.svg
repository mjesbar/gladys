  <!-- Background with Radial Gradient -->
  <circle cx="512" cy="512" r="512" fill="url(#bg-gradient)"/>

  <!-- Audio Waves (Enlarged but Nearer and Vertically Compact) -->
  <g fill="none" stroke="#BBBBBB" stroke-width="24" stroke-linecap="round">
    <!-- Left Waves - Closer to Mic Body (Starting from x=235) -->
    <path d="M235 340 A 180 180 0 0 0 235 570"/>
    <path d="M195 300 A 240 240 0 0 0 195 610"/>
    <path d="M155 260 A 300 300 0 0 0 155 650"/>

    <!-- Right Waves - Closer to Mic Body (Starting from x=789) -->
    <path d="M789 340 A 180 180 0 0 1 789 570"/>
    <path d="M829 300 A 240 240 0 0 1 829 610"/>
    <path d="M869 260 A 300 300 0 0 1 869 650"/>
  </g>

  <!-- Trapezoid Support -->
  <path fill="#000000" d="M387 776H637L612 896Q612 906 582 926H442Q412 906 412 896Z"/>

  <!-- Microphone Head -->
  <path fill="#000000" mask="url(#grid-mask)" d="     M592 808H432a160 160 0 0 1-160-160V264A160 160 0 0 1 432 104h160a160 160 0 0 1 160 160v384a160 160 0 0 1-160 160z   "/>
