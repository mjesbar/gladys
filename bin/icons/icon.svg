    <radialGradient id="bg-gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFFBB; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:1"/>
    </radialGradient>

    <mask id="grid-mask">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <g fill="#404040">
        <!-- Vertical Gaps -->
        <rect x="340.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="376.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="412.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="448.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="484.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="520.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="556.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="592.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="628.5" y="190" width="19" height="470" rx="10" ry="10"/>
        <rect x="664.5" y="190" width="19" height="470" rx="10" ry="10"/>

        <!-- Horizontal Gaps -->
        <rect x="370" y="145" width="290" height="10" rx="5" ry="5"/>
        <rect x="335" y="167" width="360" height="12" rx="6" ry="6"/>
        <rect x="310" y="186" width="400" height="14" rx="7" ry="7"/>
        <rect x="300" y="216" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="256" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="297" width="424" height="22" rx="10" ry="10"/>
        <rect x="300" y="336" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="376" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="416" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="457" width="424" height="22" rx="10" ry="10"/>
        <rect x="300" y="496" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="536" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="576" width="424" height="24" rx="10" ry="10"/>
        <rect x="300" y="617" width="424" height="22" rx="10" ry="10"/>
